name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v6
        with:
          name: foundation-lockfile
          path: package-lock.json
          retention-days: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const labels = {"architecture":"5319e7","engine":"0052cc","3d-modeling":"0e8a16","exhibition":"1d76db","basement":"5319e7","ui":"bfdadc","audio":"d4c5f9","performance":"fbca04","accessibility":"006b75","security":"b60205","testing":"0e8a16","deployment":"1d76db","documentation":"0075ca","bug":"d73a4a","enhancement":"a2eeef"};
            const backlog = [["Project Foundation",[["Initialize and verify the public repository","architecture","Set up the standalone public repository and baseline static preview.","None.","GitHub shows Public and default branch main; a Three.js perspective preview draws and resizes; its status handles load failure."],["Configure strict TypeScript and developer checks","architecture","Configure Node 24, Vite, ESLint, Prettier, and reproducible dependency installation.","Repository initialization.","A fresh checkout passes npm ci, typecheck, lint, formatting, and build."],["Write foundation documentation","documentation","Write overview, architecture, design, roadmap, asset pipeline, deployment, contributing, and security guidance.","Repository initialization.","All guides are linked and describe asset rights, module boundaries, and planned deployment."],["Add unit tests, browser smoke tests, and Linux CI","testing","Use Vitest for manifest validation and Playwright Chromium for rendering, resizing, and startup failures.","Tooling and minimal preview.","Unit and browser suites pass; one Linux CI job runs typecheck, lint, formatting, unit tests, and build."]]],["First-Person Engine",[["Build the first-person renderer and camera loop","engine","Promote the preview into a timed scene loop and an eye-height perspective camera in a simple room.","Verified Project Foundation and approval to begin Milestone 2.","The greybox loads with an eye-height view; resize and background tab restoration keep the camera stable."],["Implement WASD and pointer-lock camera controls","engine","Add frame-rate-independent WASD, clamped mouse look, and Escape pause and release.","First-person renderer and camera loop.","WASD and mouse operate on Chromium and Firefox; Escape releases lock and clears held input; resume requires a gesture."],["Implement collision, gravity, and greybox traversal","engine","Add collision proxies, player volume, ground detection, stairs, and a playable greybox route.","First-person controls.","A player cannot pass walls or display proxies, falls to the floor, and traverses test stairs without jumping."],["Add crosshair and click/E interaction","ui","Use a center ray, distance threshold, and occlusion checks with a contextual prompt.","First-person controls and greybox collision.","Click and E trigger the same visible target within range; walls and pause block activation."]]],["Main Gallery",[["Block out the gallery in Blender","3d-modeling","Model recessed walls, two freestanding islands, a small central partition, left spawn, and right basement opening.","Approved blockout layout and playable greybox.","The room fits the brief and offers a clear approach to all display surfaces and both ends."],["Create twelve anchors, frames, and gallery lights","3d-modeling","Author Exhibit_01 through Exhibit_12, define a reusable frame and lighting fixtures, and confirm facing axes.","Gallery blockout.","Exactly twelve named anchors survive export; test frames face the walkway and remain readable under the lighting."],["Optimize and integrate the gallery GLB","performance","Export render meshes, markers, and collision proxies; check naming, texture size, scale, and lighting in Three.js.","Approved layout, anchors, frames, and engine.","A fresh load spawns on the left; all twelve frames align; the gallery export meets the agreed transfer budget."]]],["Exhibition System",[["Populate exhibit displays from the typed manifest","exhibition","Connect the twelve manifest entries to Blender anchors, titles, descriptions, and reusable frames; show eleven original placeholders.","Integrated gallery GLB and approved placeholder art.","Every anchor resolves once and displays content without edits to the Blender environment."],["Integrate the approved Doraemon essay and artwork interaction","exhibition","Add the approved display image and PDF and let the visitor open exhibit details with an essay action.","Manifest-driven displays and explicit asset publication approval.","Display 01 opens its details and exposes its essay action; only approved files and metadata are public."],["Build the embedded PDF.js viewer","ui","Lazy-load PDF.js and the selected document, add scroll and zoom, and coordinate pointer lock, focus, and input.","Artwork interaction interface; use an original test fixture while approval is pending.","Viewer is keyboard usable; closing preserves pose and focus; the game does not move while the viewer is open."],["Build an accessible 2D exhibition directory","accessibility","Provide a conventional HTML route listing all exhibits and links to available essays.","Exhibit manifest and document interface.","The directory works without WebGL and all document actions work with keyboard and screen-reader navigation."]]],["Basement of Doom",[["Model the basement entrance, sign, and statue","3d-modeling","Create the far-right doorway, original metal-style lettering, and a Grim Reaper statue.","Approved gallery geometry and art direction.","The sign reads BASEMENT OF DOOM and the statue and door leave the main gallery path clear."],["Animate the door and validate stairs","engine","Connect click/E to the hinge animation and support gravity and collision on the stair route.","Basement entrance and engine traversal.","Repeated input does not leave the door and collider out of sync; visitors can descend and return."],["Author the Helvete-inspired basement and lighting","basement","Create weathered concrete and plaster, handwritten BLACK METAL graffiti, a throne, candle stand, and exposed bulb.","Approved references and entrance blockout.","All specified original props are visible, the stairs remain legible, and external asset rights are recorded."],["Load the basement independently","performance","Split the environment and optional audio into on-demand requests with failure recovery.","Basement export and door interaction.","A fresh gallery visit makes no basement asset requests; choosing to enter loads them; failure leaves the gallery usable."]]],["Visual and Audio Polish",[["Create the opening screen and pause menu","ui","Explain controls, provide Resume and settings, and restore focus during transitions.","Working exploration controls.","Keyboard users can enter, pause, and resume the tour without trapped focus."],["Add visual effects and graphics settings","performance","Implement approved effects and a lower-cost option including resolution control.","Integrated gallery and basement.","The settings change rendering behavior immediately and reduce measured GPU cost on a reference device."],["Add environmental audio and volume controls","audio","Use Web Audio with volume and mute settings, attach ambience to environments, and require a visitor gesture.","Environment loading and approved audio.","No audio plays on load; mute and volume work after opt-in; leaving an environment stops its audio."]]],["Testing and Optimization",[["Validate desktop and mobile compatibility","testing","Test supported desktop browsers, touch controls, viewport changes, and WebGL fallback.","Polished UI and supported-device list.","Record results for each browser and device; mobile navigation and the 2D directory remain usable."],["Test collision, exhibit actions, and PDF state","testing","Exercise stairs, corners, occlusion, overlays, failure handling, and repeated actions.","Playable gallery, basement, and viewer.","Regression cases pass for wall blocking, stair traversal, click/E matching, scroll/zoom, and pose preservation."],["Compress assets and profile performance","performance","Measure cold transfer, frame rate, and slow devices; compress model and texture files and record tradeoffs.","Release candidate assets.","Report desktop 60 FPS and mobile 30 FPS target results, initial transfer versus 10–20 MB, and per-file hosting limits."],["Review accessibility, security, and privacy","security","Audit keyboard/focus, contrast, screen readers, dependencies, document metadata, tracking, and asset rights.","Release candidate content and interface.","Record findings and resolve release blockers; verify no unauthorized files, default tracking, or autoplay."]]],["Public Release",[["Configure Cloudflare Pages and verify the production site","deployment","Deploy main via GitHub integration, verify the dist build, HTTPS, and asset serving.","Release approval and testing milestone.","A fresh production build deploys successfully and the public URL passes desktop and mobile smoke tests."],["Verify final content and publish version 1.0.0","documentation","Confirm final manifest, approvals, attribution, release notes, and a tagged version.","Production verification and final content approval.","Every approved document works, credits and known limitations are documented, and GitHub has a v1.0.0 release."]]]];
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo });
            const existingMilestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all' });
            for (const [name, color] of Object.entries(labels)) {
              if (!existingLabels.some((label) => label.name === name)) {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              }
            }
            for (const [index, [name, issues]] of backlog.entries()) {
              const title = `Milestone ${index + 1} — ${name}`;
              const milestone = existingMilestones.find((item) => item.title === title) ??
                (await github.rest.issues.createMilestone({ owner, repo, title })).data;
              for (const [title, label, implementation, dependencies, acceptance] of issues) {
                if (existingIssues.some((issue) => issue.title === title)) continue;
                const body = `## Objective\n\n${title}.\n\n## Implementation requirements\n\n${implementation}\n\n## Dependencies\n\n${dependencies}\n\n## Acceptance criteria\n\n- [ ] ${acceptance}`;
                await github.rest.issues.create({ owner, repo, title, body, labels: [label], milestone: milestone.number });
              }
            }
            core.info(`Verified ${backlog.length} milestones, ${backlog.flatMap(([, issues]) => issues).length} issues, and ${Object.keys(labels).length} requested labels.`);
