<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Exhibition</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Virtual Exhibition</h1>
        <p>
          First-person gallery blockout preview ·
          <a href="./directory.html">Exhibition directory</a>
        </p>
      </header>
      <section id="viewport" aria-label="3D preview">
        <canvas
          id="scene"
          role="img"
          aria-label="Eye-level view inside the exhibition"
        >
          This preview requires a browser with canvas and WebGL 2 support.
        </canvas>
        <div id="controls" hidden>
          <div class="control-panel">
            <button
              id="start-walk"
              type="button"
              aria-describedby="instructions"
            >
              Start walk
            </button>
            <p id="instructions" aria-live="polite">
              WASD to move · Mouse to look · Esc to pause
            </p>
          </div>
        </div>
        <span id="crosshair" aria-hidden="true" hidden></span>
        <p id="interaction" aria-live="polite"></p>
        <section id="exhibit-label" aria-live="polite" hidden>
          <h2></h2>
          <p></p>
        </section>
        <p id="status" role="status">Loading the 3D preview…</p>
      </section>
      <dialog id="exhibit-details" aria-labelledby="details-title">
        <h2 id="details-title"></h2>
        <img alt="" hidden />
        <p></p>
        <div class="details-actions">
          <button type="button" data-essay hidden>Read the essay</button>
          <button type="button" data-close>Close</button>
        </div>
      </dialog>
      <dialog id="essay-viewer" aria-labelledby="viewer-title">
        <div class="viewer-bar">
          <h2 id="viewer-title"></h2>
          <div class="viewer-tools">
            <button type="button" data-zoom="-1" aria-label="Zoom out">
              −
            </button>
            <output aria-live="polite">100%</output>
            <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
            <a target="_blank" rel="noopener">Open PDF file</a>
            <button type="button" data-close>Close</button>
          </div>
        </div>
        <p class="viewer-status" role="status"></p>
        <div
          class="viewer-pages"
          tabindex="0"
          role="region"
          aria-label="Essay pages. Use the arrow keys to scroll and plus or minus to zoom."
        ></div>
      </dialog>
      <noscript>Enable JavaScript to load the 3D preview.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
